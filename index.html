<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Barber Lit Nath</title>

  <!-- PWA Manifest & Styles -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <!-- Íconos para la app en iPhone -->
  <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/neon-tint/512/barber-clippers.png">
  <link rel="apple-touch-icon" href="https://img.icons8.com/neon-tint/512/barber-clippers.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/neon-tint/512/barber-clippers.png">
  
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

  <!-- Encabezado / Header -->
  <header class="app-header">
    <div class="logo-container">
      <h1 class="app-title">BARBER <span>LIT NATH</span></h1>
      <p class="app-subtitle">Programa de Fidelización ✂️</p>
    </div>
    <button id="addClientBtn" class="btn-primary">+ Nuevo Cliente</button>
  </header>

  <main class="container">
    
    <!-- Tarjetas de Estadísticas -->
    <section class="stats-section">
      <div class="stat-card">
        <span class="stat-value" id="totalClients">0</span>
        <span class="stat-label">Clientes</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalCuts">0</span>
        <span class="stat-label">Cortes Totales</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="totalBenefits">0</span>
        <span class="stat-label">Premios Disponibles</span>
      </div>
    </section>

    <!-- Sección de Copia de Seguridad -->
    <section class="backup-section" style="display: flex; gap: 10px; margin: 15px 0;">
      <button id="exportBtn" style="flex: 1; padding: 12px; background: #1a1a1a; color: #00ffcc; border: 1px solid #00ffcc; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px;">
        📥 Guardar Copia
      </button>
      <button id="importBtn" style="flex: 1; padding: 12px; background: #1a1a1a; color: #ff007f; border: 1px solid #ff007f; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 14px;">
        📤 Cargar Copia
      </button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </section>

    <!-- Buscador -->
    <section class="search-section">
      <input type="text" id="searchInput" placeholder="🔎 Buscar cliente por nombre..." class="search-input">
    </section>

    <!-- Lista de Clientes -->
    <section class="clients-section">
      <div id="clientsList" class="clients-list"></div>
    </section>

  </main>

  <!-- Modal: Agregar Cliente -->
  <div id="clientModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Registrar Cliente</h2>
        <span id="closeClientModal" class="close-btn">&times;</span>
      </div>
      <form id="clientForm">
        <div class="form-group">
          <label for="clientName">Nombre completo</label>
          <input type="text" id="clientName" placeholder="Ej: Carlos Pérez" required>
        </div>
        <div class="form-group">
          <label for="clientPhone">Teléfono (opcional)</label>
          <input type="tel" id="clientPhone" placeholder="Ej: 3001234567">
        </div>
        <button type="submit" class="btn-primary full-width">Guardar Cliente</button>
      </form>
    </div>
  </div>

  <!-- Modal: Detalles del Cliente -->
  <div id="detailsModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Detalle del Cliente</h2>
        <span id="closeDetailsModal" class="close-btn">&times;</span>
      </div>
      <div class="modal-body">
        
        <div class="client-detail-header">
          <div id="detailAvatar" class="client-avatar-large">C</div>
          <div>
            <h3 id="detailName">Cargando...</h3>
            <p id="detailPhone" class="detail-phone">📱 Sin teléfono</p>
          </div>
        </div>

        <div class="progress-container">
          <div class="progress-labels">
            <span>Progreso de cortes</span>
            <span><strong id="detailCuts">0</strong> / 15 cortes</span>
          </div>
          <div class="progress-bar">
            <div id="progressFill" class="progress-fill" style="width:

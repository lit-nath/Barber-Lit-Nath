<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Barber Lit Nath</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" sizes="180x180" href="https://img.icons8.com/color-glass/512/barber-clippers.png">
    <link rel="icon" type="image/png" href="https://img.icons8.com/color-glass/512/barber-clippers.png">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d0a1d">
</head>
<body>

    <!-- Encabezado / Header -->
    <header class="app-header">
        <div class="logo-container">
            <div class="logo-icon">✂️</div>
            <div>
                <h1 class="app-title">Barber Lit Nath</h1>
                <p class="app-subtitle">Sistema de fidelización</p>
            </div>
        </div>
    </header>

    <main class="container">
        
        <!-- Sección Bienvenida & Dashboard -->
        <section class="dashboard-welcome">
            <span class="section-tag">DASHBOARD</span>
            <h2 class="welcome-text">Bienvenido, Natanael 👋</h2>
            <p class="welcome-subtext">Administra fácilmente los cortes y beneficios de tus clientes.</p>
        </section>

        <!-- Tarjetas de Estadísticas -->
        <section class="stats-section">
            <div class="stat-card">
                <div class="stat-icon-box">👥</div>
                <div class="stat-text-box">
                    <span class="stat-label">Clientes</span>
                    <span class="stat-value" id="totalClients">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon-box">✂️</div>
                <div class="stat-text-box">
                    <span class="stat-label">Cortes registrados</span>
                    <span class="stat-value" id="totalCuts">0</span>
                </div>
            </div>
            
            <div class="stat-card">
                <div class="stat-icon-box">🎁</div>
                <div class="stat-text-box">
                    <span class="stat-label">Beneficios activos</span>
                    <span class="stat-value" id="totalBenefits">0</span>
                </div>
            </div>
        </section>

        <!-- Sección Copia de Seguridad -->
        <section class="backup-section">
            <span class="section-tag">RESPALDO</span>
            <div class="backup-buttons">
                <button id="exportBtn" class="btn-backup btn-export">📥 Guardar Copia</button>
                <button id="importBtn" class="btn-backup btn-import">📤 Cargar Copia</button>
            </div>
            <input type="file" id="importFile" accept=".json" style="display: none;">
        </section>

        <!-- Sección Clientes (Buscador & Lista) -->
        <section class="clients-main-section">
            <span class="section-tag">CLIENTES</span>
            <div class="clients-header-actions">
                <h2 class="welcome-text">Mis clientes</h2>
                <button id="addClientBtn" class="btn-add-client">+ Agregar cliente</button>
            </div>
            
            <input type="text" id="searchInput" placeholder="🔎 Buscar cliente por nombre..." class="search-input">
            
            <div id="clientsList" class="clients-list"></div>
        </section>

    </main>

    <!-- Modal: Agregar Cliente -->
    <div
